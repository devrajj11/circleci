version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:26.12

jobs:
  client:
    executor: node
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-npm-client-{{ checksum "client/package-lock.json" }}
      - run:
          name: Install dependencies
          working_directory: client
          command: npm ci
      - save_cache:
          key: v1-npm-client-{{ checksum "client/package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Build
          working_directory: client
          command: npm run build

  # The server has no build, test or lint scripts yet, so this job only installs
  # dependencies and runs a placeholder step. Replace it once scripts exist.
  server:
    executor: node
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-npm-server-{{ checksum "server/package-lock.json" }}
      - run:
          name: Install dependencies
          working_directory: server
          command: npm ci
      - save_cache:
          key: v1-npm-server-{{ checksum "server/package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Placeholder for build, test and lint
          command: echo "No build, test or lint scripts in server/package.json yet"

workflows:
  ci:
    jobs:
      - client
      - server